services:
  db:
    image: postgres:17
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Localhost only: lets runserver and pytest on the host reach the database.
      # Host port follows POSTGRES_PORT in .env, so it can dodge a local Postgres.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_LOG_FILE: /app/logs/django.log
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      # Localhost only: the API is never exposed beyond this machine.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # --- Remote access (step 9) ----------------------------------------------------
  # Profiles: plain `docker compose up` stays db + web. `--profile remote` adds mcp and
  # edge for local testing (edge on 127.0.0.1:8080); `--profile public` adds the tunnel
  # too (the laptop).

  mcp:
    profiles: [remote, public]
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    env_file: .env
    environment:
      FILAMENTS_API_URL: http://web:8000/api
      FILAMENTS_INTROSPECTION_URL: http://web:8000/o/introspect/
    depends_on:
      web:
        condition: service_healthy
    # No published port: only edge reaches it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:8000/.well-known/oauth-protected-resource/mcp', headers={'Host': 'mcp'}))"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  edge:
    profiles: [remote, public]
    image: caddy:2.11.9
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # Localhost only, for testing the allowlist with curl. The tunnel reaches edge
      # over the Docker network.
      - "127.0.0.1:8080:80"
    depends_on:
      web:
        condition: service_healthy
      mcp:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    profiles: [public]
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # From .env. The tunnel's one public hostname points at http://edge:80.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - edge
    restart: unless-stopped

volumes:
  pgdata:
