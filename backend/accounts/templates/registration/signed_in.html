<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed in · Filaments</title>
  <style>
    :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fafafa; --muted: #666; --accent: #2b59c3; --err: #b3261e; }
    @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #161616; --muted: #aaa; --accent: #8fb0ff; --err: #ff8a80; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 17px/1.5 system-ui, -apple-system, sans-serif; }
    main { width: min(22rem, 100% - 2rem); }
    h1 { font-size: 1.4rem; margin: 0 0 1.25rem; }
    label { display: block; margin: 0.9rem 0 0.3rem; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 0.7rem; font-size: 1rem; border: 1px solid var(--muted);
            border-radius: 8px; background: transparent; color: inherit; }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button { width: 100%; min-height: 44px; margin-top: 1.4rem; border: 0; border-radius: 8px; font-size: 1rem;
             font-weight: 600; background: var(--accent); color: var(--bg); cursor: pointer; }
    .error { color: var(--err); margin: 0 0 1rem; }
    .hint { color: var(--muted); font-size: 0.9rem; margin-top: 1.25rem; }
  </style>
</head>
<body>
<main>
  <h1>You're signed in</h1>
  <p>Claude can now save and find your notes. You can close this page.</p>
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Sign out</button>
  </form>
</main>
</body>
</html>
