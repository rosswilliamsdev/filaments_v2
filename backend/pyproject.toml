[project]
name = "filaments-backend"
version = "0.1.0"
description = "Filaments v2 Django + Ninja API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "django-oauth-toolkit>=3.4,<4",
    "filaments-schemas",
]

[tool.uv]
package = false

[tool.uv.sources]
filaments-schemas = { workspace = true }
