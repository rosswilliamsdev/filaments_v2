[project]
name = "filaments-schemas"
version = "0.1.0"
description = "Shared Pydantic request/response schemas for the API and MCP server. No Django imports."
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemas"]
