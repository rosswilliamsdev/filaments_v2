[project]
name = "filaments-v2"
version = "0.1.0"
description = "Filaments v2 workspace root (not a package)"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "filaments-backend",
    "filaments-mcp",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "mcp_server", "schemas"]

[tool.uv.sources]
filaments-backend = { workspace = true }
filaments-mcp = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
# Django-generated; not hand-edited.
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "api", "config", "filaments", "filaments_mcp", "schemas"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend", "backend/tests"]  # backend/tests: shared test helpers (oauth_helpers)
testpaths = ["backend/tests", "mcp_server/tests", "schemas/tests"]
